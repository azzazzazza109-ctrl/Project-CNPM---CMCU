<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ thống Đăng ký Sự kiện CMCU</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f6f9; }
        .card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>Danh sách Sự kiện Trường CMCU</h1>
    <div id="event-list">Đang tải sự kiện...</div>

    <script>
        // Mặc định giả lập đang đăng nhập là sinh viên ID số 1 (Nguyễn Văn Long - Khóa K3)
        const currentUserId = 1; 

        async function loadEvents() {
            const res = await fetch('/api/events');
            const events = await res.json();
            let html = '';
            events.forEach(ev => {
                html += `
                    <div class="card">
                        <h3>${ev.title}</h3>
                        <p>Sức chứa: ${ev.registered_count} / ${ev.capacity} chỗ</p>
                        <p>Điều kiện: Dành riêng cho khóa ${ev.required_cohort} - Khoa ${ev.required_faculty}</p>
                        <button onclick="registerEvent(${ev.id})">Đăng ký ngay</button>
                    </div>
                `;
            });
            document.getElementById('event-list').innerHTML = html;
        }

        async function registerEvent(eventId) {
            const res = await fetch('/api/tickets/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ student_id: currentUserId, event_id: eventId })
            });
            const data = await res.json();
            alert(data.message);
        }

        loadEvents();
    </script>
</body>
</html>
