<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Sự kiện CMCU</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f9f9f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #218838; }
        #result { margin-top: 20px; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Đăng ký Vé Tham Gia Sự kiện</h2>
        <div class="form-group">
            <label for="userId">ID Người dùng (User ID):</label>
            <input type="number" id="userId" value="1" placeholder="Nhập ID của bạn">
        </div>
        <div class="form-group">
            <label for="eventId">ID Sự kiện (Event ID):</label>
            <input type="number" id="eventId" value="1" placeholder="Nhập ID sự kiện">
        </div>
        <button onclick="registerEvent()">Đăng ký ngay</button>

        <div id="result"></div>
    </div>

    <script>
        async function registerEvent() {
            const user_id = document.getElementById('userId').value;
            const event_id = document.getElementById('eventId').value;
            const resultDiv = document.getElementById('result');

            resultDiv.innerHTML = 'Đang xử lý...';
            resultDiv.className = '';

            try {
                // Trỏ chính xác đến cổng 5000 của backend Node.js
                const response = await fetch('http://localhost:5000/api/events/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        user_id: parseInt(user_id), 
                        event_id: parseInt(event_id) 
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `<strong>Thành công!</strong> ${data.message}<br>Mã vé của bạn: <code>${data.data.ticket_code}</code>`;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = `<strong>Lỗi:</strong> ${data.message || 'Không thể đăng ký vé!'}`;
                }
            } catch (error) {
                console.error('Lỗi kết nối:', error);
                resultDiv.className = 'error';
                resultDiv.innerHTML = '<strong>Lỗi kết nối:</strong> Không thể kết nối đến server backend!';
            }
        }
    </script>

</body>
</html>
