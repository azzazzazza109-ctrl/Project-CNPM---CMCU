<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Quét Check-in - Ban Tổ Chức CMCU</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #121212; color: #fff; margin: 0; padding: 16px; text-align: center; }
        .camera-container { width: 100%; max-width: 380px; height: 320px; margin: 20px auto; background: #000; border-radius: 16px; position: relative; border: 2px solid #0052cc; display: flex; align-items: center; justify-content: center; }
        .scanner-laser { width: 80%; height: 2px; background: #00e676; box-shadow: 0 0 8px #00e676; position: absolute; }
        .status-box { max-width: 380px; margin: auto; padding: 16px; border-radius: 12px; font-weight: bold; display: none; }
        .status-success { background: #1b5e20; color: #a5d6a7; border: 1px solid #66bb6a; }
        .status-error { background: #b71c1c; color: #ffcdd2; border: 1px solid #ef5350; }
        .manual-btn { margin-top: 20px; background: #333; color: #fff; border: 1px solid #555; padding: 12px 24px; border-radius: 8px; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>
    <h3>BÀN SOÁT VÉ HỘI TRƯỜNG</h3>
    <p style="font-size: 13px; color: #aaa;">Hướng camera điện thoại vào mã QR của sinh viên</p>

    <div class="camera-container">
        <div class="scanner-laser"></div>
        <span style="color: #666;">[ CAMERA STREAM VIEW ]</span>
    </div>

    <!-- Hộp thông báo phản hồi trạng thái -->
    <div id="statusBox" class="status-box status-success" style="display: block;">
        ✔ CHECK-IN THÀNH CÔNG<br>
        <span style="font-size: 14px; font-weight: normal;">Trần Long (BIT250001) - Lúc 08:15:30</span>
    </div>

    <button class="manual-btn" onclick="alert('Mở ô nhập tay Mã SV BIT250xxx khi rớt mạng')">
        ⌨ Điểm danh thủ công bằng Mã SV
    </button>
</body>
</html>
